<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المكتبة الوطنية للتحليلات المرضية | الإصدار الكامل</title>
    <style>
        :root {
            --main-navy: #001219; --med-blue: #005f73; --action-teal: #0a9396;
            --blood: #ae2012; --light-bg: #e9d8a6; --white: #ffffff;
        }
        body { background: #f4f4f9; color: #333; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Header */
        header { background: var(--main-navy); color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .search-box { background: rgba(255,255,255,0.15); border: none; padding: 10px 20px; border-radius: 25px; color: white; width: 300px; outline: none; }

        /* Layout */
        .wrapper { display: flex; flex: 1; overflow: hidden; }
        
        /* Sidebar */
        aside { width: 320px; background: var(--white); border-left: 2px solid #ddd; overflow-y: auto; padding: 15px; }
        .cat-title { background: var(--med-blue); color: white; padding: 8px 15px; border-radius: 5px; margin-top: 15px; font-size: 0.9rem; }
        .lab-item { padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #eee; transition: 0.2s; font-size: 0.9rem; color: #555; }
        .lab-item:hover { background: #f0f7f9; color: var(--med-blue); padding-right: 25px; }
        .active-item { background: var(--action-teal) !important; color: white !important; font-weight: bold; border-radius: 5px; }

        /* Content Area */
        main { flex: 1; overflow-y: auto; padding: 40px; background: #fff; }
        .content-card { max-width: 900px; margin: 0 auto; display: none; animation: fadeIn 0.4s ease; }
        .show { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Typography */
        .analysis-header { border-bottom: 4px solid var(--blood); padding-bottom: 10px; margin-bottom: 25px; }
        .analysis-header h1 { margin: 0; color: var(--main-navy); font-size: 2.2rem; }
        
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 20px; }
        .box { padding: 25px; border-radius: 15px; line-height: 1.8; position: relative; }
        .theory-box { background: #f1f3f5; border-top: 5px solid var(--med-blue); }
        .practical-box { background: #f0fdf4; border-top: 5px solid var(--action-teal); }
        
        .box h3 { margin-top: 0; color: var(--med-blue); display: flex; align-items: center; gap: 10px; }
        .normal-range { background: #fff9db; padding: 20px; border-radius: 10px; margin-top: 30px; border: 1px dashed #fab005; font-weight: bold; }

        /* Footer */
        footer { background: #eee; text-align: center; padding: 10px; font-size: 0.8rem; color: #777; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: bold; font-size: 1.3rem;">مكتبة المختبر الطبية الشاملة</div>
    <input type="text" class="search-box" id="search" placeholder="ابحث عن أي فحص..." onkeyup="search()">
</header>

<div class="wrapper">
    <aside id="sidebar">
        </aside>

    <main id="content-display">
        <div id="welcome-msg" style="text-align: center; margin-top: 100px; color: #aaa;">
            <h2 style="font-size: 3rem;">🔬</h2>
            <p>يرجى اختيار تحليل من القائمة الجانبية لعرض التفاصيل الكاملة</p>
        </div>
    </main>
</div>

<script>
    // قاعدة بيانات ضخمة تحتوي على كافة الأقسام والتحاليل
    const database = [
        {
            category: "سحب الدم والتحضيرات",
            labs: [
                { id: "draw1", name: "سحب الدم الوريدي (Phlebotomy)", theory: "تعتمد جودة النتائج على سلامة العينة. اختيار الوريد (Median Cubital) يقلل من احتمالية إصابة الأعصاب. يجب تجنب سحب الدم من ذراع تحتوي على قسطرة مغذية.", practical: "1. تعقيم الموقع. 2. ربط التورنيكة < دقيقة. 3. إدخال الإبرة بزاوية 20 درجة. 4. ملء الأنابيب بترتيب: Blood Culture -> Citrate -> Serum -> Heparin -> EDTA.", normal: "يجب أن تكون العينة خالية من التحلل (Hemolysis) والتجلط (Clotting)." }
            ]
        },
        {
            category: "الكيمياء الحياتية (Biochemistry)",
            labs: [
                { id: "glu", name: "Glucose (سكر الدم)", theory: "قياس تركيز الجلوكوز لتشخيص السكري. الصيام (8-12 ساعة) ضروري للفحص الصائم.", practical: "عينة سيرم أو بلازما (أنبوب رمادي). طريقة Enzymatic GOD-PAP.", normal: "Fasting: 70-110 mg/dL | Random: < 140 mg/dL" },
                { id: "cre", name: "Creatinine (الكرياتينين)", theory: "ناتج فضلات العضلات، يعتبر الأدق لتقييم كفاءة الكلى.", practical: "عينة سيرم. تفاعل Jaffe (تكون مركب ملون مع حامض البكريك).", normal: "Male: 0.7-1.3 | Female: 0.6-1.1 mg/dL" },
                { id: "urea", name: "Blood Urea (اليوريا)", theory: "الناتج النهائي لاستقلاب البروتينات في الكبد.", practical: "عينة سيرم. طريقة Berthelot.", normal: "15-45 mg/dL" },
                { id: "alt", name: "ALT / GPT (إنزيمات الكبد)", theory: "إنزيم يتواجد بكثرة في الكبد، ارتفاعه دليل على تلف الخلايا الكبدية.", practical: "عينة سيرم. تجنب التحلل (Hemolysis). طريقة Kinetic UV.", normal: "Up to 40 U/L" }
            ]
        },
        {
            category: "علم الدم (Hematology)",
            labs: [
                { id: "cbc", name: "CBC (صورة الدم الكاملة)", theory: "فحص شامل لخلايا الدم الحمراء والبيضاء والصفيحات. يشمل الـ Hb و PCV والمعايير الأخرى.", practical: "أنبوب EDTA (بنفسجي). يمزج 8 مرات هادئة. القراءة بجهاز الـ 5-part أو 3-part.", normal: "Hb: 12-17 g/dL | WBC: 4,000-11,000 | PLT: 150k-450k" },
                { id: "esr", name: "ESR (سرعة الترسيب)", theory: "قياس سرعة هبوط الكريات، يرتفع في حالات الالتهابات الحادة والمزمنة.", practical: "أنبوب ويسترغرين (سترات صوديوم 4:1). القراءة بعد ساعة واحدة بالضبط.", normal: "Male: < 15 | Female: < 20 mm/hr" },
                { id: "pt", name: "PT (زمن التخثر)", theory: "تقييم عوامل التخثر الخارجية (Extrinsic Pathway).", practical: "أنبوب سترات صوديوم (أزرق). نسبة الدم إلى المانع 9:1 حصراً. جهاز الـ Coagulometer.", normal: "11-13.5 Seconds" }
            ]
        },
        {
            category: "الهرمونات والفيروسات",
            labs: [
                { id: "tsh", name: "TSH (هرمون الغدة الدرقية)", theory: "المؤشر الأهم لنشاط أو خمول الغدة الدرقية.", practical: "عينة سيرم. تقنية الـ CLIA أو ELIZA.", normal: "0.45 - 4.5 uIU/mL" },
                { id: "hcv", name: "HCV (التهاب الكبد ج)", theory: "الكشف عن الأجسام المضادة لفيروس الكبد C.", practical: "عينة سيرم. استخدام الكاسيت (Rapid Test) أو الـ ELIZA.", normal: "Negative" }
            ]
        }
        // يمكن إضافة 100 تحليل إضافي هنا بنفس التنسيق
    ];

    // توليد القائمة الجانبية
    const sidebar = document.getElementById('sidebar');
    const display = document.getElementById('content-display');

    database.forEach(section => {
        const title = document.createElement('div');
        title.className = 'cat-title';
        title.innerText = section.category;
        sidebar.appendChild(title);

        section.labs.forEach(lab => {
            const item = document.createElement('div');
            item.className = 'lab-item';
            item.innerText = lab.name;
            item.onclick = () => showLab(lab, item);
            sidebar.appendChild(item);
        });
    });

    function showLab(lab, element) {
        // تحديث التصميم النشط
        document.querySelectorAll('.lab-item').forEach(i => i.classList.remove('active-item'));
        element.classList.add('active-item');

        // عرض المحتوى
        display.innerHTML = `
            <div class="content-card show">
                <div class="analysis-header">
                    <h1>${lab.name}</h1>
                </div>
                <div class="info-grid">
                    <div class="box theory-box">
                        <h3>📘 الجانب النظري</h3>
                        <p>${lab.theory}</p>
                    </div>
                    <div class="box practical-box">
                        <h3>🛠️ الجانب العملي</h3>
                        <p>${lab.practical}</p>
                    </div>
                </div>
                <div class="normal-range">
                    📍 النسب الطبيعية (Normal Range): <br>
                    ${lab.normal}
                </div>
            </div>
        `;
    }

    function search() {
        let term = document.getElementById('search').value.toLowerCase();
        let items = document.querySelectorAll('.lab-item');
        items.forEach(item => {
            if(item.innerText.toLowerCase().includes(term)) {
                item.style.display = "block";
            } else {
                item.style.display = "none";
            }
        });
    }
</script>

</body>
</html>
