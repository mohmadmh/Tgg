<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام المختبر المتكامل v8.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src='https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js'></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f1f5f9; }
        .diag-gradient { background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%); }
        .report-paper { box-shadow: 0 30px 60px -12px rgba(0,0,0,0.1); border-radius: 3rem; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body class="text-slate-900">

    <header class="bg-slate-950 text-white p-5 no-print sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black italic tracking-tighter">GLOBAL LAB <span class="text-indigo-400 text-xs">AI v8.0</span></h1>
            <div class="flex gap-2">
                <button onclick="setLanguage('ar')" id="btnAr" class="px-5 py-2 rounded-xl text-xs font-black transition bg-indigo-600">عربي</button>
                <button onclick="setLanguage('en')" id="btnEn" class="px-5 py-2 rounded-xl text-xs font-black transition">English</button>
            </div>
        </div>
    </header>

    <main class="container mx-auto p-4 md:p-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- لوحة التحكم -->
        <div class="lg:col-span-4 space-y-6 no-print">
            <div class="bg-indigo-600 p-10 rounded-[2.5rem] shadow-xl text-white text-center">
                <h3 class="font-black text-xl mb-4">الماسح الضوئي الذكي</h3>
                <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="processImage(this)">
                <label for="imageInput" class="block w-full bg-white text-indigo-700 py-4 rounded-2xl cursor-pointer font-black hover:scale-105 transition-all shadow-lg">رفع صورة التحليل</label>
                <div id="loader" class="hidden mt-4 animate-pulse text-xs font-black uppercase tracking-widest">Scanning...</div>
            </div>

            <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-200">
                <h3 class="text-xs font-black text-slate-400 mb-6 uppercase tracking-widest">إضافة تحاليل يدوية</h3>
                <select id="testType" class="w-full bg-slate-50 p-4 rounded-2xl mb-4 font-bold border-none outline-none"></select>
                <input type="number" id="testValue" step="0.001" placeholder="النتيجة" class="w-full bg-slate-100 p-6 rounded-2xl mb-6 text-center text-5xl font-black outline-none border-none">
                
                <div class="space-y-3">
                    <button onclick="manualAdd()" class="w-full bg-slate-950 text-white py-5 rounded-2xl font-black hover:bg-indigo-600 transition-all">إضافة للتقرير</button>
                    <button onclick="clearAllData()" class="w-full bg-rose-50 text-rose-600 py-4 rounded-2xl font-black hover:bg-rose-600 hover:text-white transition-all border border-rose-100">مسح وإفراغ التقرير</button>
                </div>
            </div>
        </div>

        <!-- التقرير والتشخيص -->
        <div class="lg:col-span-8">
            <div id="printableReport" class="bg-white p-10 md:p-16 report-paper border border-slate-100 min-h-[1100px]">
                
                <div id="diagnosisBox" class="p-10 rounded-[3rem] text-white mb-12 hidden transition-all duration-500 shadow-2xl">
                    <h3 class="text-[10px] font-black uppercase tracking-[0.3em] mb-4 opacity-70">Clinical Diagnostic Insight</h3>
                    <div id="diagnosisContent" class="text-xl font-bold leading-relaxed space-y-4"></div>
                </div>

                <div class="flex justify-between border-b-2 border-slate-900 pb-10 mb-12">
                    <h2 class="text-4xl font-black italic tracking-tighter uppercase">Lab Results</h2>
                    <div class="text-left font-black text-[10px] text-slate-400">
                        DATE: <span id="rDate" class="text-slate-900"></span><br>
                        REF: <span id="rID" class="text-indigo-600"></span>
                    </div>
                </div>

                <table class="w-full">
                    <thead>
                        <tr class="text-slate-400 text-[11px] font-black uppercase border-b">
                            <th class="py-4 text-right">Investigation</th>
                            <th class="py-4 text-center">Result</th>
                            <th class="py-4 text-center">Reference</th>
                            <th class="py-4 text-center">Status</th>
                        </tr>
                    </thead>
                    <tbody id="reportTableBody" class="divide-y divide-slate-50"></tbody>
                </table>
            </div>

            <button onclick="window.print()" class="w-full mt-8 bg-indigo-600 text-white py-6 rounded-3xl font-black shadow-xl no-print">تصدير كملف PDF</button>
        </div>
    </main>

    <!-- نظام الأرشيف -->
    <button onclick="toggleHistory()" class="no-print fixed bottom-6 left-6 bg-slate-950 text-white w-14 h-14 rounded-full shadow-2xl flex items-center justify-center hover:scale-110 transition-all z-[100] border-2 border-indigo-500">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 we-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
    </button>

    <div id="historyPanel" class="no-print fixed bottom-24 left-6 w-80 bg-white rounded-[2rem] shadow-2xl border border-slate-200 hidden z-[100] overflow-hidden">
        <div class="bg-slate-950 p-4 text-white font-black text-[10px] uppercase flex justify-between items-center">
            <span>سجل التقارير السابقة</span>
            <button onclick="toggleHistory()">✕</button>
        </div>
        <div id="historyList" class="max-h-96 overflow-y-auto p-4 space-y-3">
            <div class="text-center text-slate-400 text-xs py-10">لا توجد سجلات محفوظة حالياً</div>
        </div>
    </div>

    <script>
        const MASTER_DB = {
            // --- 1. السكريات (Diabetes Profile) ---
            "FBS": { n: "FBS", ar: "سكر صائم", u: "mg/dL", r: "70-110", k: ["fbs", "fasting"], c: v => v > 110 },
            "RBS": { n: "RBS", ar: "سكر عشوائي", u: "mg/dL", r: "80-140", k: ["rbs", "random"], c: v => v > 200 },
            "PPBS": { n: "PPBS", ar: "سكر بعد الأكل بساعتين", u: "mg/dL", r: "< 140", k: ["ppbs", "post prandial", "2h"], c: v => v > 140 },
            "HBA1C": { n: "HbA1c", ar: "السكر التراكمي", u: "%", r: "4.0-5.6", k: ["hba1c", "glyco"], c: v => v > 6.4 },
            "OGTT": { n: "OGTT", ar: "اختبار تحمل الجلوكوز", u: "mg/dL", r: "< 140", k: ["ogtt", "tolerance"], c: v => v > 140 },

            // --- 2. صورة الدم الكاملة (CBC Profile) ---
            "WBC": { n: "WBC", ar: "كريات الدم البيضاء", u: "10^3/uL", r: "4.0-11.0", k: ["wbc", "white blood"], c: v => v < 4.0 || v > 11.0 },
            "RBC": { n: "RBC", ar: "كريات الدم الحمراء", u: "10^6/uL", r: "4.5-5.9", k: ["rbc", "red blood"], c: v => v < 4.5 || v > 5.9 },
            "HGB": { n: "HGB", ar: "الهيموجلوبين", u: "g/dL", r: "13.5-17.5", k: ["hb", "hgb", "hemoglobin"], c: v => v < 13.5 },
            "HCT": { n: "HCT", ar: "حجم الخلايا المكدسة", u: "%", r: "41-50", k: ["hct", "hematocrit", "pcv"], c: v => v < 41 },
            "MCV": { n: "MCV", ar: "متوسط حجم الكرية", u: "fL", r: "80-100", k: ["mcv"], c: v => v < 80 || v > 100 },
            "MCH": { n: "MCH", ar: "متوسط هيموجلوبين الكرية", u: "pg", r: "27-33", k: ["mch"], c: v => v < 27 },
            "MCHC": { n: "MCHC", ar: "تركيز هيموجلوبين الكرية", u: "g/dL", r: "32-36", k: ["mchc"], c: v => v < 32 },
            "PLT": { n: "PLT", ar: "الصفائح الدموية", u: "10^3/uL", r: "150-450", k: ["plt", "platelet"], c: v => v < 150 || v > 450 },
            "RDW": { n: "RDW", ar: "توزيع حجم الحمراء", u: "%", r: "11.5-14.5", k: ["rdw"], c: v => v > 14.5 },
            
            // --- 3. تمايز الكريات البيض (WBC Differential) ---
            "NEUT": { n: "Neutrophils", ar: "العدلات", u: "%", r: "40-75", k: ["neut"], c: v => false },
            "LYMPH": { n: "Lymphocytes", ar: "اللمفاويات", u: "%", r: "20-45", k: ["lymph"], c: v => false },
            "MONO": { n: "Monocytes", ar: "الوحيدات", u: "%", r: "2-8", k: ["mono"], c: v => false },
            "EOS": { n: "Eosinophils", ar: "الحمضات", u: "%", r: "1-4", k: ["eos"], c: v => false },

            // --- 4. الدهون (Lipid Profile) ---
            "CHOL": { n: "Cholesterol", ar: "الكوليسترول الكلي", u: "mg/dL", r: "< 200", k: ["cholesterol", "chol"], c: v => v > 200 },
            "TRIG": { n: "Triglycerides", ar: "الدهون الثلاثية", u: "mg/dL", r: "< 150", k: ["triglyceride", "tg", "trig"], c: v => v > 150 },
            "HDL": { n: "HDL", ar: "الكوليسترول النافع", u: "mg/dL", r: "> 40", k: ["hdl"], c: v => v < 40 },
            "LDL": { n: "LDL", ar: "الكوليسترول الضار", u: "mg/dL", r: "< 130", k: ["ldl"], c: v => v > 130 },
            "VLDL": { n: "VLDL", ar: "كوليسترول منخفض جداً", u: "mg/dL", r: "5-40", k: ["vldl"], c: v => v > 40 },

            // --- 5. تحاليل إضافية هامة ---
            "ESR": { n: "ESR", ar: "سرعة الترسيب", u: "mm/hr", r: "0-20", k: ["esr"], c: v => v > 20 },
            "CRP": { n: "CRP", ar: "البروتين الالتهابي", u: "mg/L", r: "< 6.0", k: ["crp"], c: v => v > 6.0 },
            "FERR": { n: "Ferritin", ar: "مخزون الحديد", u: "ng/mL", r: "30-400", k: ["ferritin"], c: v => v < 30 }
        };

        let currentResults = {};
        let currentLang = 'ar';
        let reportHistory = [];

        function addToReport(key, val) {
            currentResults[key] = val;
            const db = MASTER_DB[key];
            const isAlert = db.c(val);
            if (document.getElementById(`row-${key}`)) document.getElementById(`row-${key}`).remove();
            const row = `<tr id="row-${key}" class="font-bold border-b border-slate-50">
                <td class="py-6 text-right"><div class="text-indigo-600">${db.n}</div><div class="text-[10px] text-slate-400 uppercase">${db.ar}</div></td>
                <td class="py-6 text-center text-3xl font-black">${val} <span class="text-[9px] font-normal">${db.u}</span></td>
                <td class="py-6 text-center text-slate-400 text-xs">${db.r}</td>
                <td class="py-6 text-center"><span class="px-4 py-2 rounded-xl text-[10px] ${isAlert ? 'bg-red-50 text-red-600 border border-red-100' : 'bg-green-50 text-green-600 border border-green-100'}">${isAlert ? (currentLang==='ar'?'غير طبيعي':'Abnormal') : 'Normal'}</span></td>
            </tr>`;
            document.getElementById('reportTableBody').innerHTML += row;
            runDiagnosis();
        }

        function runDiagnosis() {
            let d = []; let severity = 'normal'; const r = currentResults;
            // تشخيص السكر
            if (r.HBA1C > 6.4 || r.FBS > 125 || r.RBS > 200) { severity = 'warning'; d.push("● تنبيه: مؤشرات سكر دم مرتفعة (Diabetes Risk)."); }
            // تشخيص فقر الدم
            if (r.HGB < 12 || r.MCV < 80) { severity = 'warning'; d.push("● مؤشرات فقر دم، يرجى فحص مخزون الحديد."); }
            // تشخيص الدهون
            if (r.CHOL > 240 || r.TRIG > 200) { severity = 'warning'; d.push("● ارتفاع في مستوى الدهون الكلية."); }
            // تشخيص الالتهاب
            if (r.WBC > 11 || r.CRP > 6) { severity = 'warning'; d.push("● مؤشرات تدل على وجود نشاط التهابي في الجسم."); }

            const box = document.getElementById('diagnosisBox');
            const content = document.getElementById('diagnosisContent');
            if (d.length > 0) {
                box.classList.remove('hidden');
                content.innerHTML = d.map(i => `<div class="pb-2">${i}</div>`).join('');
                box.className = `p-10 rounded-[3rem] text-white mb-12 shadow-2xl ${severity==='critical'?'bg-red-900 animate-pulse':'bg-orange-600'}`;
            } else { box.classList.add('hidden'); }
        }

        function clearAllData() {
            if (Object.keys(currentResults).length > 0) {
                reportHistory.unshift({ id: document.getElementById('rID').innerText, data: {...currentResults}, date: new Date().toLocaleTimeString('ar-IQ') });
                if (reportHistory.length > 10) reportHistory.pop();
                updateHistoryUI();
            }
            currentResults = {};
            document.getElementById('reportTableBody').innerHTML = '';
            document.getElementById('diagnosisBox').classList.add('hidden');
            document.getElementById('testValue').value = '';
            document.getElementById('rID').innerText = 'DX-' + Math.random().toString(36).substr(2, 6).toUpperCase();
        }

        function updateHistoryUI() {
            const list = document.getElementById('historyList');
            list.innerHTML = reportHistory.map((h, i) => `<div onclick="loadReport(${i})" class="p-3 bg-slate-50 rounded-xl border cursor-pointer hover:border-indigo-400 transition-all"><div class="flex justify-between text-[10px] font-black text-indigo-600 uppercase"><span>${h.id}</span><span>${h.date}</span></div></div>`).join('');
        }

        function loadReport(i) {
            const h = reportHistory[i];
            document.getElementById('reportTableBody').innerHTML = '';
            currentResults = {};
            Object.keys(h.data).forEach(k => addToReport(k, h.data[k]));
            document.getElementById('rID').innerText = h.id;
            toggleHistory();
        }

        function toggleHistory() { document.getElementById('historyPanel').classList.toggle('hidden'); }

        async function processImage(input) {
            document.getElementById('loader').classList.remove('hidden');
            const { data: { text } } = await Tesseract.recognize(input.files[0], 'eng');
            Object.keys(MASTER_DB).forEach(key => {
                MASTER_DB[key].k.forEach(keyword => {
                    const match = text.match(new RegExp(`${keyword}\\D*(\\d+\\.?\\d*)`, 'i'));
                    if (match) addToReport(key, parseFloat(match[1]));
                });
            });
            document.getElementById('loader').classList.add('hidden');
        }

        function manualAdd() {
            const k = document.getElementById('testType').value;
            const v = parseFloat(document.getElementById('testValue').value);
            if(!isNaN(v)) addToReport(k, v);
        }

        function setLanguage(l) {
            currentLang = l;
            document.getElementById('mainHtml').dir = l === 'ar' ? 'rtl' : 'ltr';
        }

        const select = document.getElementById('testType');
        Object.keys(MASTER_DB).sort().forEach(k => { select.innerHTML += `<option value="${k}">${k} - ${MASTER_DB[k].ar}</option>`; });
        document.getElementById('rDate').innerText = new Date().toLocaleDateString('en-GB');
        document.getElementById('rID').innerText = 'DX-' + Math.random().toString(36).substr(2, 6).toUpperCase();
    </script>
</body>
</html>
