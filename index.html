<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام مختبر القدس المتكامل v0.0 | AL-QUDS MEGA LAB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src='https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js'></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f1f5f9; scroll-behavior: smooth; }
        .report-paper { border-radius: 4rem; box-shadow: 0 50px 100px -20px rgba(0,0,0,0.2); border-top: 20px solid #1e293b; background: white; }
        .status-badge { transition: all 0.3s ease; }
        @media print { .no-print { display: none !important; } .report-paper { box-shadow: none; border: none; margin: 0; padding: 0; width: 100%; } }
        .alert-glow { animation: alert-pulse 1.5s infinite; background: linear-gradient(90deg, #991b1b, #dc2626); }
        @keyframes alert-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }
    </style>
</head>
<body class="p-2 md:p-6 text-slate-900">

    <nav class="bg-slate-900 text-white p-6 rounded-[2.5rem] mb-10 no-print flex justify-between items-center shadow-2xl border-b-4 border-indigo-600">
        <div class="flex items-center gap-4">
            <div class="w-14 h-14 bg-indigo-600 rounded-2xl flex items-center justify-center font-black text-3xl italic shadow-indigo-500/50 shadow-lg">Q</div>
            <div>
                <h1 class="text-2xl font-black uppercase tracking-tighter leading-none">Al-Quds Lab <span class="text-indigo-400">Mega v19.0</span></h1>
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-[0.4em]">Advanced Diagnostic System</p>
            </div>
        </div>
        <button onclick="window.print()" class="bg-indigo-600 hover:bg-indigo-500 px-10 py-3 rounded-2xl font-black text-sm transition-all shadow-xl">حفظ PDF</button>
    </nav>

    <main class="container mx-auto grid grid-cols-1 lg:grid-cols-12 gap-10">
        
        <div class="lg:col-span-4 space-y-6 no-print">
            <div class="bg-slate-900 p-8 rounded-[3rem] text-white shadow-2xl relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-indigo-500"></div>
                <h3 class="font-black text-lg mb-6 flex items-center gap-2">الماسح الضوئي الذكي (OCR)</h3>
                <input type="file" id="ocrFile" class="hidden" onchange="runOCR(this)">
                <label for="ocrFile" class="block w-full py-6 bg-white text-slate-900 rounded-3xl text-center font-black cursor-pointer hover:bg-indigo-50 transition-all shadow-2xl">رفع وتحليل الصورة</label>
                <div id="ocrStatus" class="hidden mt-4 text-center animate-bounce text-indigo-400 text-xs font-black italic">جاري مطابقة كافة الفحوصات...</div>
            </div>

            <div class="bg-white p-8 rounded-[3rem] shadow-xl border border-slate-200">
                <h3 class="text-[10px] font-black text-slate-400 mb-6 uppercase tracking-widest italic text-center">الإدخال اليدوي الشامل</h3>
                <div class="space-y-4">
                    <select id="testSelect" class="w-full p-4 bg-slate-50 rounded-2xl font-black border-2 border-transparent focus:border-indigo-500 outline-none"></select>
                    <input type="text" id="testValue" placeholder="أدخل النتيجة" class="w-full p-6 bg-slate-100 rounded-3xl text-center text-5xl font-black text-indigo-700 outline-none border-none">
                    <button onclick="manualAdd()" class="w-full py-6 bg-slate-950 text-white rounded-3xl font-black hover:bg-indigo-600 transition-all shadow-xl">تحديث السجل</button>
                </div>
                <div class="mt-8 pt-8 border-t flex justify-between px-2">
                    <button onclick="clearCurrent()" class="text-rose-500 text-[10px] font-black uppercase hover:underline">× تفريغ</button>
                    <button onclick="toggleHist()" class="text-indigo-600 text-[10px] font-black uppercase hover:underline">الأرشيف الحافظ</button>
                </div>
            </div>
        </div>

        <div class="lg:col-span-8">
            <div id="reportBox" class="report-paper p-10 md:p-16 min-h-[1200px]">
                
                <div id="diagBox" class="hidden p-10 rounded-[3.5rem] text-white mb-12 shadow-2xl transition-all border-4">
                    <div id="diagIn" class="text-xl font-bold leading-relaxed space-y-4"></div>
                </div>

                <div class="flex justify-between items-end border-b-8 border-slate-900 pb-10 mb-12">
                    <div>
                        <h2 class="text-6xl font-black italic tracking-tighter text-slate-900 uppercase">REPORT</h2>
                        <p class="text-indigo-600 font-black text-sm tracking-[0.4em] uppercase">Jerusalem Medical Laboratory</p>
                    </div>
                    <div class="text-left font-black text-xs uppercase leading-tight">
                        REF: <span id="repID" class="text-indigo-600"></span><br>
                        DATE: <span id="repDate"></span>
                    </div>
                </div>

                <table class="w-full">
                    <thead>
                        <tr class="text-slate-400 text-[10px] font-black uppercase border-b-2 tracking-widest">
                            <th class="py-4 text-right">Investigation / الفحص</th>
                            <th class="py-4 text-center">Result / النتيجة</th>
                            <th class="py-4 text-center">Reference / الطبيعي</th>
                            <th class="py-4 text-center">Status / الحالة</th>
                        </tr>
                    </thead>
                    <tbody id="repBody" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="histSide" class="fixed inset-y-0 left-0 w-80 bg-white shadow-3xl z-[2000] transform -translate-x-full transition-transform duration-500 no-print border-r-4 border-indigo-600">
        <div class="bg-slate-950 p-8 text-white">
            <h3 class="font-black text-2xl italic uppercase mb-2">Archive</h3>
            <button onclick="toggleHist()" class="text-indigo-400 font-bold">إغلاق ✕</button>
        </div>
        <div id="histList" class="p-4 space-y-4 overflow-y-auto h-full"></div>
    </div>

    <script>
        // قاعدة البيانات العملاقة المرتبة تسلسلياً (v19.0)
        const DB = {
            // 1. السكريات
            "FBS": { n: "FBS", ar: "سكر صائم", u: "mg/dL", r: "70-110", k: ["fbs", "fasting"], c: v => v > 110, o: 1 },
            "RBS": { n: "RBS", ar: "سكر عشوائي", u: "mg/dL", r: "80-140", k: ["rbs", "random"], c: v => v > 160, o: 2 },
            "HBA1C": { n: "HbA1c", ar: "السكر التراكمي", u: "%", r: "4.5-5.6", k: ["hba1c"], c: v => v > 6.4, o: 3 },
            // 2. الكلى
            "CREA": { n: "Creatinine", ar: "الكرياتينين", u: "mg/dL", r: "0.6-1.3", k: ["crea", "creatinine"], c: v => v > 1.3, o: 4 },
            "UREA": { n: "Urea", ar: "اليوريا", u: "mg/dL", r: "15-45", k: ["urea"], c: v => v > 45, o: 5 },
            "UA": { n: "Uric Acid", ar: "حمض اليوريك", u: "mg/dL", r: "3.5-7.2", k: ["ua", "uric"], c: v => v > 7.2, o: 6 },
            // 3. الكبد
            "ALT": { n: "ALT (SGPT)", ar: "إنزيم كبد", u: "U/L", r: "0-41", k: ["alt", "sgpt"], c: v => v > 41, o: 7 },
            "AST": { n: "AST (SGOT)", ar: "إنزيم كبد", u: "U/L", r: "0-40", k: ["ast", "sgot"], c: v => v > 40, o: 8 },
            "BIL_T": { n: "Bilirubin Total", ar: "الصفراء الكلية", u: "mg/dL", r: "0.2-1.2", k: ["bil", "bilirubin"], c: v => v > 1.2, o: 9 },
            // 4. الدهون
            "CHOL": { n: "Cholesterol", ar: "الكوليسترول", u: "mg/dL", r: "< 200", k: ["chol"], c: v => v > 200, o: 10 },
            "TRIG": { n: "Triglycerides", ar: "الدهون الثلاثية", u: "mg/dL", r: "< 150", k: ["trig", "tg"], c: v => v > 150, o: 11 },
            // 5. الدم والالتهابات
            "HGB": { n: "HGB", ar: "الهيموجلوبين", u: "g/dL", r: "13-17", k: ["hb", "hgb"], c: v => v < 13, o: 12 },
            "WBC": { n: "WBC", ar: "الكرات البيضاء", u: "10^3", r: "4-11", k: ["wbc"], c: v => v > 11, o: 13 },
            "PLT": { n: "PLT", ar: "الصفائح", u: "10^3", r: "150-450", k: ["plt"], c: v => v < 150, o: 14 },
            "ESR": { n: "ESR", ar: "سرعة الترسيب", u: "mm/hr", r: "0-20", k: ["esr"], c: v => v > 20, o: 15 },
            "CRP": { n: "CRP", ar: "البروتين الالتهابي", u: "mg/L", r: "0-6", k: ["crp"], c: v => v > 6, o: 16 },
            // 6. فحوصات الحمل الشاملة (جديد)
            "PT_QUAL": { n: "Pregnancy (Qual)", ar: "فحص الحمل (النوعي)", u: "-", r: "Negative", k: ["pregnancy test", "pt test"], c: v => v.toLowerCase().includes("pos"), o: 17 },
            "HCG_QUANT": { n: "S.HCG (Quant)", ar: "هرمون الحمل الرقمي", u: "mIU/mL", r: "< 5.0", k: ["hcg", "beta hcg"], c: v => v > 5, o: 18 },
            "PT_URINE": { n: "Pregnancy Urine", ar: "فحص حمل إدرار", u: "-", r: "Negative", k: ["urine pt"], c: v => v.toLowerCase().includes("pos"), o: 19 },
            // 7. هرمونات وفيتامينات
            "TSH": { n: "TSH", ar: "هرمون الغدة", u: "uIU/mL", r: "0.4-4.5", k: ["tsh"], c: v => v > 4.5, o: 20 },
            "VITD": { n: "Vitamin D3", ar: "فيتامين د", u: "ng/mL", r: "30-100", k: ["vit d", "d3"], c: v => v < 30, o: 21 },
            // 8. الإدرار
            "U_PUS": { n: "Urine Pus", ar: "خلايا صديدية", u: "hpf", r: "1-4", k: ["pus"], c: v => v > 5, o: 22 },
            "U_RBC": { n: "Urine RBCs", ar: "كريات حمراء", u: "hpf", r: "0-2", k: ["rbc"], c: v => v > 2, o: 23 },
            "U_ALB": { n: "Urine Albumin", ar: "زلال البول", u: "-", r: "Nil", k: ["alb", "protein"], c: v => v != 'Nil', o: 24 }
        };

        let current = {};
        let archive = JSON.parse(localStorage.getItem('alquds_mega_archive') || '[]');

        function updateUI(key, val) {
            current[key] = val;
            const body = document.getElementById('repBody');
            body.innerHTML = "";
            Object.keys(DB).sort((a,b) => DB[a].o - DB[b].o).forEach(k => {
                if(current[k]) {
                    const item = DB[k];
                    const isAlert = item.c(parseFloat(current[k]) || current[k]);
                    body.innerHTML += `
                        <tr class="font-bold border-b border-slate-50 group hover:bg-indigo-50 transition-all duration-300">
                            <td class="py-8 text-right"><div class="text-indigo-600 text-2xl font-black">${item.n}</div><div class="text-[10px] text-slate-400 uppercase">${item.ar}</div></td>
                            <td class="py-8 text-center text-4xl font-black">${current[k]} <span class="text-[10px] font-normal text-slate-300 uppercase">${item.u}</span></td>
                            <td class="py-8 text-center text-slate-400 text-xs font-bold">${item.r}</td>
                            <td class="py-8 text-center"><span class="px-6 py-2 rounded-2xl text-[10px] font-black uppercase ${isAlert ? 'bg-rose-50 text-rose-600 border border-rose-100' : 'bg-green-50 text-green-600 border border-green-100'}">${isAlert ? 'Abnormal' : 'Normal'}</span></td>
                        </tr>`;
                }
            });
            runDiagnostics();
        }

        function runDiagnostics() {
            let notes = []; let level = 'ok'; const r = current;
            const f = (v) => parseFloat(v);

            if (f(r.HCG_QUANT) > 5 || (r.PT_QUAL && r.PT_QUAL.toLowerCase().includes("pos"))) {
                notes.push("● <b>نتيجة الحمل:</b> إيجابية (+)؛ نبارك لكم هذه النتيجة وننصح بمتابعة الفيتامينات الأساسية.");
            }
            if (f(r.CREA) > 1.3 || f(r.UREA) > 45) { level = f(r.CREA)>2?'crit':'warn'; notes.push("● <b>وظائف الكلى:</b> يوجد ارتفاع ملحوظ؛ يجب الابتعاد عن البروتينات العالية والأملاح."); }
            if (f(r.HBA1C) > 6.4) { level = 'crit'; notes.push("● <b>داء السكري:</b> القراءات مرتفعة؛ يجب البدء فوراً ببرنامج غذائي خالي من السكر."); }
            if (f(r.HGB) < 13) notes.push("● <b>فقر الدم:</b> الهيموجلوبين منخفض؛ يفضل تناول الأغذية الغنية بالحديد.");
            if (f(r.U_PUS) > 5) notes.push("● <b>صديد البول:</b> يشير لوجود التهاب في المسالك؛ اشرب الكثير من السوائل.");

            const box = document.getElementById('diagBox');
            if (notes.length > 0) {
                box.classList.remove('hidden');
                document.getElementById('diagIn').innerHTML = notes.map(n => `<div class="pb-3 border-b border-white/10 last:border-0">${n}</div>`).join('');
                box.className = `p-10 rounded-[3.5rem] text-white mb-12 shadow-2xl border-4 transition-all ${level=='crit'?'alert-glow border-rose-400':'bg-orange-500 border-orange-300'}`;
            } else if (Object.keys(r).length > 0) {
                box.classList.remove('hidden'); box.className = "p-10 rounded-[3.5rem] bg-emerald-600 text-white mb-12 shadow-2xl border-4 border-emerald-400 text-center";
                document.getElementById('diagIn').innerHTML = "● جميع فحوصاتك سليمة وضمن الحدود الطبيعية.";
            } else { box.classList.add('hidden'); }
        }

        async function runOCR(inp) {
            document.getElementById('ocrStatus').classList.remove('hidden');
            const { data: { text } } = await Tesseract.recognize(inp.files[0], 'eng+ara');
            Object.keys(DB).forEach(k => {
                DB[k].k.forEach(kw => {
                    const m = text.match(new RegExp(`${kw}\\D*(\\d+\\.?\\d*)`, 'i'));
                    if (m) updateUI(k, m[1]);
                });
            });
            document.getElementById('ocrStatus').classList.add('hidden');
        }

        function manualAdd() {
            const k = document.getElementById('testSelect').value;
            const v = document.getElementById('testValue').value;
            if(v.trim()) updateUI(k, v);
            document.getElementById('testValue').value = "";
        }

        function clearCurrent() {
            if (Object.keys(current).length > 0) {
                archive.unshift({ id: document.getElementById('repID').innerText, data: {...current}, date: new Date().toLocaleString() });
                localStorage.setItem('alquds_mega_archive', JSON.stringify(archive));
                renderHist();
            }
            current = {}; document.getElementById('repBody').innerHTML = ""; document.getElementById('diagBox').classList.add('hidden'); genID();
        }

        function renderHist() {
            document.getElementById('histList').innerHTML = archive.map((h, i) => `
                <div onclick="loadHist(${i})" class="p-4 bg-slate-50 rounded-2xl border-2 hover:border-indigo-600 cursor-pointer transition-all">
                    <div class="flex justify-between text-[10px] font-black text-indigo-600 mb-1"><span>${h.id}</span><span>${h.date}</span></div>
                    <div class="text-[9px] text-slate-400 truncate">${Object.keys(h.data).join(', ')}</div>
                </div>`).join('');
        }

        function loadHist(i) {
            const h = archive[i]; current = {}; document.getElementById('repBody').innerHTML = "";
            Object.keys(h.data).forEach(k => updateUI(k, h.data[k]));
            document.getElementById('repID').innerText = h.id; toggleHist();
        }

        function toggleHist() { document.getElementById('histSide').classList.toggle('-translate-x-full'); }
        function genID() { document.getElementById('repID').innerText = 'QL-' + Math.random().toString(36).substr(2, 7).toUpperCase(); }

        const sel = document.getElementById('testSelect');
        Object.keys(DB).sort((a,b) => DB[a].o - DB[b].o).forEach(k => { sel.innerHTML += `<option value="${k}">${k} - ${DB[k].ar}</option>`; });
        document.getElementById('repDate').innerText = new Date().toLocaleDateString('en-GB');
        genID(); renderHist();
    </script>
</body>
</html>
