<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام المختبر المتكامل - الذكاء الاصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- مكتبة OCR موثوقة -->
    <script src='https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js'></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f4f7f6; }
        .diagnostic-card { border-right: 8px solid #4f46e5; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- القسم العلوي: الرفع والتحكم -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 no-print">
            
            <!-- وحدة رفع الصور -->
            <div class="bg-white p-6 rounded-3xl shadow-lg border border-slate-100 text-center">
                <h3 class="text-indigo-600 font-black mb-4">رفع صورة التحليل / Upload Report</h3>
                <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImage(this)">
                <button onclick="document.getElementById('imageInput').click()" class="w-full py-8 border-2 border-dashed border-indigo-200 rounded-2xl hover:bg-indigo-50 transition-all group">
                    <div id="uploadText">
                        <span class="block text-2xl mb-2">📸</span>
                        <span class="font-bold text-slate-600">اضغط هنا لرفع الصورة من الاستوديو</span>
                    </div>
                    <div id="loadingBox" class="hidden">
                        <div class="animate-spin h-8 w-8 border-4 border-indigo-600 border-t-transparent rounded-full mx-auto"></div>
                        <p class="text-indigo-600 font-black mt-2">جاري استخراج البيانات...</p>
                    </div>
                </button>
            </div>

            <!-- إضافة يدوية -->
            <div class="bg-white p-6 rounded-3xl shadow-lg border border-slate-100">
                <h3 class="text-slate-500 font-black mb-4">إضافة يدوية / Manual Entry</h3>
                <div class="flex gap-2">
                    <select id="manualKey" class="flex-1 p-3 bg-slate-50 rounded-xl font-bold border-none outline-none"></select>
                    <input type="number" id="manualVal" placeholder="النتيجة" class="w-24 p-3 bg-slate-100 rounded-xl font-black text-center">
                    <button onclick="addManualData()" class="bg-indigo-600 text-white px-6 rounded-xl font-black">إضافة</button>
                </div>
            </div>
        </div>

        <!-- صندوق التشخيص الذكي -->
        <div id="aiBox" class="hidden bg-slate-900 text-white p-8 rounded-3xl shadow-2xl diagnostic-card">
            <div class="flex items-center gap-3 mb-4">
                <span class="animate-pulse w-3 h-3 bg-red-500 rounded-full"></span>
                <h3 class="text-indigo-400 font-black tracking-widest uppercase text-sm">التشخيص الذكي | Smart AI Diagnosis</h3>
            </div>
            <div id="aiContent" class="space-y-3 font-bold text-lg leading-relaxed"></div>
        </div>

        <!-- التقرير النهائي -->
        <div id="printableReport" class="bg-white p-8 md:p-12 rounded-[2.5rem] shadow-xl border border-slate-100">
            <div class="flex justify-between items-center border-b-2 border-slate-900 pb-6 mb-8">
                <div>
                    <h1 class="text-3xl font-black text-slate-900 italic">LABORATORY REPORT</h1>
                    <p class="text-indigo-600 font-bold text-xs uppercase tracking-widest">Medical Analysis System</p>
                </div>
                <div class="text-left font-bold text-xs">
                    <p>Date: <span id="currentDate"></span></p>
                    <p>ID: <span id="reportID"></span></p>
                </div>
            </div>

            <table class="w-full text-right" dir="rtl">
                <thead>
                    <tr class="text-slate-400 text-xs font-black uppercase border-b">
                        <th class="py-4 px-2">التحليل / Test</th>
                        <th class="py-4 text-center">النتيجة / Result</th>
                        <th class="py-4 text-center">الطبيعي / Range</th>
                        <th class="py-4 text-center">الحالة / Status</th>
                    </tr>
                </thead>
                <tbody id="reportRows" class="divide-y divide-slate-50">
                    <!-- النتائج تظهر هنا -->
                </tbody>
            </table>
        </div>

        <button onclick="window.print()" class="w-full bg-slate-950 text-white py-6 rounded-3xl font-black text-xl hover:bg-indigo-600 transition-all no-print shadow-xl">حفظ أو طباعة التقرير (PDF)</button>
    </div>

    <script>
        const LAB_DB = {
            "HBA1C": { n: "HbA1c", ar: "السكر التراكمي", r: [4.0, 5.6], u: "%", k: ["hba1c", "glyco"] },
            "FBS": { n: "FBS", ar: "سكر صائم", r: [70, 100], u: "mg/dL", k: ["fbs", "fasting", "glucose"] },
            "TSH": { n: "TSH", ar: "الغدة الدرقية", r: [0.45, 4.5], u: "uIU/mL", k: ["tsh", "thyro"] },
            "CREATININE": { n: "Creatinine", ar: "الكرياتينين", r: [0.7, 1.3], u: "mg/dL", k: ["creat"] },
            "UREA": { n: "Urea", ar: "اليوريا", r: [15, 45], u: "mg/dL", k: ["urea"] },
            "CRP": { n: "CRP", ar: "البروتين الالتهابي", r: [0, 6], u: "mg/L", k: ["crp", "reactive"] },
            "TROPONIN": { n: "Troponin", ar: "تروبونين القلب", r: [0, 0.04], u: "ng/mL", k: ["trop"] },
            "ALT": { n: "ALT", ar: "إنزيم كبد", r: [0, 41], u: "U/L", k: ["alt", "gpt"] },
            "FERRITIN": { n: "Ferritin", ar: "مخزون الحديد", r: [30, 400], u: "ng/mL", k: ["ferritin"] }
        };

        let results = {};

        async function handleImage(input) {
            if (!input.files[0]) return;
            document.getElementById('uploadText').classList.add('hidden');
            document.getElementById('loadingBox').classList.remove('hidden');

            try {
                const worker = await Tesseract.createWorker();
                await worker.loadLanguage('eng');
                await worker.initialize('eng');
                const { data: { text } } = await worker.recognize(input.files[0]);
                const lowerText = text.toLowerCase();

                Object.keys(LAB_DB).forEach(key => {
                    LAB_DB[key].k.forEach(keyword => {
                        if (lowerText.includes(keyword)) {
                            const regex = new RegExp(keyword + "[\\s\\:\\-\\=]*(\\d+\\.?\\d*)", "i");
                            const match = lowerText.match(regex);
                            if (match) updateUI(key, parseFloat(match[1]));
                        }
                    });
                });
                await worker.terminate();
            } catch (e) { alert("حدث خطأ في معالجة الصورة"); }

            document.getElementById('uploadText').classList.remove('hidden');
            document.getElementById('loadingBox').classList.add('hidden');
        }

        function updateUI(key, val) {
            results[key] = val;
            const item = LAB_DB[key];
            const isHigh = val > item.r[1];
            const isLow = val < item.r[0];

            const existingRow = document.getElementById(`row-${key}`);
            if (existingRow) existingRow.remove();

            const row = `<tr id="row-${key}" class="font-bold border-b border-slate-50">
                <td class="py-6 px-2 text-right"><span class="text-indigo-600 block text-lg">${item.n}</span><span class="text-[10px] text-slate-400 font-bold uppercase">${item.ar}</span></td>
                <td class="py-6 text-center text-3xl font-black text-slate-900">${val} <span class="text-[10px] text-slate-400 font-normal">${item.u}</span></td>
                <td class="py-6 text-center text-slate-400 font-mono text-sm">${item.r[0]} - ${item.r[1]}</td>
                <td class="py-6 text-center"><span class="px-4 py-1 rounded-full text-[10px] ${isHigh || isLow ? 'bg-red-100 text-red-600' : 'bg-green-100 text-green-600'}">${isHigh ? 'High ↑' : (isLow ? 'Low ↓' : 'Normal')}</span></td>
            </tr>`;
            
            document.getElementById('reportRows').insertAdjacentHTML('beforeend', row);
            runDiagnosis();
        }

        function runDiagnosis() {
            let diags = [];
            if (results.HBA1C > 6.4) diags.push("● تنبيه: مستوى السكر التراكمي مرتفع جداً (Diabetes Range).");
            if (results.TROPONIN > 0.04) diags.push("● تحذير طارئ: ارتفاع التروبونين يستدعي فحص القلب فوراً.");
            if (results.CREATININE > 1.3) diags.push("● مؤشر على إجهاد في وظائف الكلى.");
            if (results.TSH > 4.5) diags.push("● مؤشرات أولية لقصور الغدة الدرقية.");
            if (results.CRP > 10) diags.push("● وجود علامات التهاب حاد في الجسم.");

            const box = document.getElementById('aiBox');
            if (diags.length > 0) {
                box.classList.remove('hidden');
                document.getElementById('aiContent').innerHTML = diags.join('<br>');
            }
        }

        function addManualData() {
            const key = document.getElementById('manualKey').value;
            const val = parseFloat(document.getElementById('manualVal').value);
            if (!isNaN(val)) updateUI(key, val);
        }

        // إعدادات أولية
        document.getElementById('currentDate').innerText = new Date().toLocaleDateString();
        document.getElementById('reportID').innerText = 'ANALYTIC-' + Math.random().toString(36).substr(2, 6).toUpperCase();
        const select = document.getElementById('manualKey');
        Object.keys(LAB_DB).sort().forEach(k => { select.innerHTML += `<option value="${k}">${k} (${LAB_DB[k].ar})</option>`; });
    </script>
</body>
</html>
