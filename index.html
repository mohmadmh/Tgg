<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام التشخيص الذكي المتكامل | Smart Clinical OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src='https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js'></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
        .en-mode { font-family: 'Inter', sans-serif; direction: ltr; }
        .diagnosis-card { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body class="text-slate-900">

    <header class="bg-indigo-950 text-white p-5 no-print shadow-2xl sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-500 rounded-lg flex items-center justify-center font-black text-xl italic shadow-lg">AI</div>
                <h1 class="text-xl font-black tracking-tight">SMART <span class="text-indigo-400">DIAGNOSIS</span></h1>
            </div>
            <div class="flex gap-2">
                <button onclick="setLanguage('ar')" id="btnAr" class="px-4 py-2 rounded-xl text-xs font-black transition bg-indigo-600">AR</button>
                <button onclick="setLanguage('en')" id="btnEn" class="px-4 py-2 rounded-xl text-xs font-black transition bg-slate-800">EN</button>
            </div>
        </div>
    </header>

    <main class="container mx-auto p-4 md:p-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- لوحة التحكم -->
        <div class="lg:col-span-4 space-y-6 no-print">
            <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-200">
                <input type="text" id="pName" placeholder="اسم المريض" class="w-full bg-slate-50 p-4 rounded-xl mb-4 outline-none focus:ring-2 ring-indigo-500 font-bold">
                <div class="grid grid-cols-2 gap-4">
                    <input type="number" id="pAge" placeholder="العمر" class="bg-slate-50 p-4 rounded-xl outline-none focus:ring-2 ring-indigo-500 font-bold">
                    <select id="pGender" class="bg-slate-50 p-4 rounded-xl outline-none focus:ring-2 ring-indigo-500 font-black">
                        <option value="Male">ذكر</option>
                        <option value="Female">أنثى</option>
                    </select>
                </div>
            </div>

            <div class="bg-indigo-600 p-8 rounded-[2rem] shadow-xl text-white">
                <h3 class="font-black text-lg mb-4">مسح التقارير الذكي</h3>
                <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="processImage(this)">
                <label for="imageInput" class="block w-full bg-white text-indigo-700 py-4 rounded-xl text-center cursor-pointer font-black hover:bg-indigo-50 transition shadow-lg">تحميل صورة التحليل</label>
            </div>

            <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-200">
                <select id="testType" class="w-full bg-slate-50 p-4 rounded-xl mb-4 text-xs font-black"></select>
                <input type="number" id="testValue" step="0.01" placeholder="أدخل النتيجة" class="w-full bg-slate-100 p-5 rounded-xl mb-4 text-center text-4xl font-black text-indigo-900 outline-none">
                <button onclick="manualAdd()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-black hover:bg-indigo-600 transition">إضافة وتحديث التشخيص</button>
            </div>
        </div>

        <!-- التقرير الطبي -->
        <div class="lg:col-span-8">
            <div id="printableReport" class="bg-white p-8 md:p-16 rounded-[3rem] shadow-2xl min-h-[1100px] border border-slate-100 relative">
                
                <div class="flex justify-between items-start mb-12 border-b-2 border-slate-900 pb-10">
                    <div>
                        <h2 class="text-4xl font-black text-slate-900">MEDICAL REPORT</h2>
                        <p class="text-[10px] font-black text-indigo-600 tracking-[0.4em]">AI-POWERED CLINICAL DECISION SUPPORT</p>
                    </div>
                    <div class="text-right text-[10px] font-bold text-slate-400">
                        DATE: <span id="rDate" class="text-slate-900"></span><br>
                        REF: <span id="rID" class="text-indigo-600"></span>
                    </div>
                </div>

                <!-- قسم التشخيص الذكي الجديد -->
                <div id="diagnosisSection" class="mb-12 diagnosis-card p-8 rounded-[2.5rem] text-white hidden animate-pulse">
                    <div class="flex items-center gap-3 mb-4">
                        <span class="w-3 h-3 bg-green-400 rounded-full animate-ping"></span>
                        <h3 class="font-black text-xs uppercase tracking-widest text-indigo-300">AI Intelligent Diagnosis | التشخيص الذكي</h3>
                    </div>
                    <div id="diagnosisText" class="text-lg font-bold leading-relaxed italic"></div>
                </div>

                <div class="grid grid-cols-2 gap-8 mb-12 bg-slate-50 p-8 rounded-[2rem]">
                    <div><span class="text-[9px] font-black text-slate-400 uppercase block">Patient</span><span id="rName" class="text-lg font-black italic">---</span></div>
                    <div class="text-left"><span class="text-[9px] font-black text-slate-400 uppercase block">Profile</span><span class="font-black"><span id="rAge">--</span>Y / <span id="rGender">--</span></span></div>
                </div>

                <table class="w-full mb-12">
                    <thead>
                        <tr class="text-slate-400 text-[10px] font-black border-b">
                            <th class="py-4 text-right">Investigation</th>
                            <th class="py-4 text-center">Result</th>
                            <th class="py-4 text-center">Reference</th>
                            <th class="py-4 text-center">Status</th>
                        </tr>
                    </thead>
                    <tbody id="reportTableBody" class="divide-y divide-slate-100"></tbody>
                </table>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="infoArea"></div>
            </div>

            <div class="mt-8 flex gap-4 no-print pb-20">
                <button onclick="window.print()" class="flex-1 bg-indigo-600 text-white py-5 rounded-2xl font-black shadow-xl">تحميل PDF</button>
            </div>
        </div>
    </main>

    <script>
        const MASTER_DB = {
            "BHCG": { n: "Beta-HCG", ar: "تحليل الحمل الرقمي", u: "mIU/mL", r: "Non-Preg < 5", k: ["hcg", "beta-hcg"], c: v => v > 5 ? {s_ar:"حامل", s_en:"Pregnant", d:true} : {s_ar:"سلبي", s_en:"Negative", d:false} },
            "HGB": { n: "Hemoglobin", ar: "الهيموجلوبين", u: "g/dL", r: "12 - 17", k: ["hb", "hgb"], c: v => v < 12 ? {s_ar:"منخفض", s_en:"Low", d:true} : {s_ar:"طبيعي", s_en:"Normal", d:false} },
            "FBS": { n: "Fasting Sugar", ar: "سكر الصيام", u: "mg/dL", r: "70 - 100", k: ["fbs", "glucose"], c: v => v > 125 ? {s_ar:"مرتفع", s_en:"High", d:true} : {s_ar:"طبيعي", s_en:"Normal", d:false} },
            "TSH": { n: "TSH", ar: "غدة درقية", u: "uIU/mL", r: "0.4 - 4.5", k: ["tsh"], c: v => v > 4.5 ? {s_ar:"خمول", s_en:"Hypothyroid", d:true} : {s_ar:"طبيعي", s_en:"Normal", d:false} },
            "FERRITIN": { n: "Ferritin", ar: "مخزون الحديد", u: "ng/mL", r: "30 - 400", k: ["ferritin"], c: v => v < 30 ? {s_ar:"نقص", s_en:"Low", d:true} : {s_ar:"كافٍ", s_en:"Normal", d:false} }
        };

        let activeResults = {};

        function updateSmartDiagnosis() {
            let diagAr = [];
            let diagEn = [];
            const keys = Object.keys(activeResults);

            // منطق التشخيص المترابط
            if (activeResults["HGB"] < 12 && activeResults["FERRITIN"] < 30) {
                diagAr.push("فقر دم ناتج عن نقص مخزون الحديد (Iron Deficiency Anemia).");
                diagEn.push("Iron Deficiency Anemia detected.");
            }
            if (activeResults["BHCG"] > 5) {
                diagAr.push("حالة حمل مؤكدة مخبرياً، يُرجى المتابعة مع طبيب التوليد.");
                diagEn.push("Confirmed laboratory pregnancy.");
            }
            if (activeResults["FBS"] > 125) {
                diagAr.push("مؤشرات صريحة لمرض السكري (Hyperglycemia).");
                diagEn.push("Hyperglycemia (Potential Diabetes).");
            }
            if (activeResults["TSH"] > 4.5) {
                diagAr.push("اشتباه في خمول الغدة الدرقية (Hypothyroidism).");
                diagEn.push("Hypothyroidism suspected.");
            }

            const diagBox = document.getElementById('diagnosisSection');
            const diagText = document.getElementById('diagnosisText');
            
            if (diagAr.length > 0) {
                diagBox.classList.remove('hidden');
                diagText.innerHTML = currentLang === 'ar' ? diagAr.join('<br>') : diagEn.join('<br>');
            }
        }

        function addToReport(key, val) {
            activeResults[key] = val; // تخزين النتيجة للتشخيص
            const db = MASTER_DB[key];
            const res = db.c(val);
            
            document.getElementById('rName').innerText = document.getElementById('pName').value || "MEMBER";
            document.getElementById('rAge').innerText = document.getElementById('pAge').value || "--";
            document.getElementById('rGender').innerText = document.getElementById('pGender').value;

            const row = `<tr class="hover:bg-slate-50 font-bold">
                <td class="py-5 text-right"><div class="text-indigo-600">${db.n}</div><div class="text-[10px] text-slate-400">${db.ar}</div></td>
                <td class="py-5 text-center text-xl">${val} <span class="text-[9px]">${db.u}</span></td>
                <td class="py-5 text-center text-slate-400 text-xs">${db.r}</td>
                <td class="py-5 text-center"><span class="px-3 py-1 rounded-full text-[10px] ${res.d ? 'bg-red-100 text-red-600' : 'bg-green-100 text-green-600'}">${currentLang === 'ar' ? res.s_ar : res.s_en}</span></td>
            </tr>`;
            document.getElementById('reportTableBody').innerHTML += row;
            
            updateSmartDiagnosis();
        }

        // إكمال الدوال الأساسية (manualAdd, setLanguage, processImage بنفس منطق الردود السابقة)
        let currentLang = 'ar';
        function setLanguage(l) { currentLang = l; updateSmartDiagnosis(); }
        const select = document.getElementById('testType');
        Object.keys(MASTER_DB).forEach(k => { select.innerHTML += `<option value="${k}">${MASTER_DB[k].ar}</option>`; });
        function manualAdd() { addToReport(select.value, parseFloat(document.getElementById('testValue').value)); }
        document.getElementById('rDate').innerText = new Date().toLocaleDateString();
        document.getElementById('rID').innerText = 'ID-' + Math.random().toString(36).substr(2, 5).toUpperCase();
    </script>
</body>
</html>
