<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو المطعم الاحترافي</title>
    <style>
        body { background-color: #000; color: #fff; font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; }
        .container { border: 2px solid #c5a059; padding: 20px; border-radius: 15px; max-width: 400px; margin: auto; }
        h1 { color: #c5a059; text-transform: uppercase; }
        .item { border-bottom: 1px solid #222; padding: 15px 0; }
        .price { color: #c5a059; font-weight: bold; display: block; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>RESTAURANT X</h1>
        <div class="item">
            <h3>سلطة الأفوكادو الملكية</h3>
            <p>وصف سينمائي بإضاءة خافتة</p>
            <span class="price">12,000 د.ع</span>
        </div>
        <div class="item">
            <h3>ستيك ريمبرانت المشوي</h3>
            <p>تجربة طعام فنية فريدة</p>
            <span class="price">35,000 د.ع</span>
        </div>
        <p style="margin-top: 20px; font-size: 12px; color: #555;">مدعوم بنظام SaaS المنيو الذكي</p>
    </div>
</body>
</html>
