<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام المختبر الشامل الذكي v6.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src='https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js'></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
        .diag-gradient { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); }
        .report-shadow { box-shadow: 0 40px 100px -20px rgba(0,0,0,0.2); }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body class="text-slate-900">

    <!-- الهيدر -->
    <header class="bg-slate-950 text-white p-5 no-print border-b border-indigo-500/20">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center font-black">L</div>
                <h1 class="text-xl font-black">ULTRA LAB <span class="text-indigo-400 text-[10px] block">AI DIAGNOSTIC v6.0</span></h1>
            </div>
            <div class="flex gap-2">
                <button onclick="setLanguage('ar')" id="btnAr" class="px-4 py-2 rounded-lg text-xs font-bold transition bg-indigo-600">عربي</button>
                <button onclick="setLanguage('en')" id="btnEn" class="px-4 py-2 rounded-lg text-xs font-bold transition">English</button>
            </div>
        </div>
    </header>

    <main class="container mx-auto p-4 md:p-10 grid grid-cols-1 lg:grid-cols-12 gap-10">
        
        <!-- التحكم (يمين) -->
        <div class="lg:col-span-4 space-y-6 no-print">
            <!-- بيانات المريض -->
            <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-200">
                <h3 class="text-xs font-black text-indigo-600 mb-4 uppercase">معلومات الحالة</h3>
                <input type="text" id="pName" placeholder="الاسم" class="w-full bg-slate-50 p-3 rounded-xl mb-3 outline-none font-bold border-none">
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="pAge" placeholder="العمر" class="bg-slate-50 p-3 rounded-xl outline-none font-bold border-none">
                    <select id="pGender" class="bg-slate-50 p-3 rounded-xl font-black border-none">
                        <option value="Male">ذكر</option>
                        <option value="Female">أنثى</option>
                    </select>
                </div>
            </div>

            <!-- رفع الصور -->
            <div class="bg-indigo-600 p-8 rounded-[2rem] text-white shadow-xl">
                <h3 class="font-black text-lg mb-2">قراءة الصور (OCR)</h3>
                <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="processImage(this)">
                <label for="imageInput" class="block w-full bg-white text-indigo-700 py-4 rounded-xl text-center cursor-pointer font-black hover:bg-slate-100 transition-all">اختر صورة التحليل</label>
                <div id="loader" class="hidden mt-4 text-center animate-pulse text-[10px] font-black uppercase">Scanning Image...</div>
            </div>

            <!-- الإضافة اليدوية -->
            <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-200">
                <h3 class="text-xs font-black text-slate-400 mb-4 uppercase">إضافة يدوية (120+ تحليل)</h3>
                <select id="testType" class="w-full bg-slate-50 p-3 rounded-xl mb-3 text-sm font-bold border-none outline-none"></select>
                <input type="number" id="testValue" step="0.001" placeholder="النتيجة" class="w-full bg-slate-100 p-5 rounded-xl mb-4 text-center text-4xl font-black text-indigo-900 outline-none">
                <button onclick="manualAdd()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-black hover:bg-indigo-600 transition-all">تحديث التقرير</button>
            </div>
        </div>

        <!-- التقرير (يسار) -->
        <div class="lg:col-span-8">
            <div id="printableReport" class="bg-white p-8 md:p-16 report-shadow rounded-[3rem] border border-slate-100 min-h-[1100px]">
                
                <!-- هيدر التقرير -->
                <div class="flex justify-between items-start mb-12 border-b-2 border-slate-100 pb-8">
                    <div>
                        <h2 class="text-3xl font-black text-slate-900 italic uppercase">Medical Lab Report</h2>
                        <p class="text-[10px] font-black text-indigo-600 tracking-widest uppercase">AI-Powered Diagnostic System</p>
                    </div>
                    <div class="text-left text-[10px] font-bold text-slate-400">
                        Date: <span id="rDate" class="text-slate-900"></span><br>
                        ID: <span id="rID" class="text-indigo-600"></span>
                    </div>
                </div>

                <!-- التشخيص الذكي -->
                <div id="diagnosisBox" class="diag-gradient p-8 rounded-[2.5rem] text-white mb-10 hidden shadow-xl">
                    <h3 class="text-indigo-400 text-[10px] font-black uppercase tracking-widest mb-4">Smart Diagnostic Summary</h3>
                    <div id="diagnosisContent" class="text-lg font-bold space-y-3"></div>
                </div>

                <!-- جدول النتائج -->
                <table class="w-full">
                    <thead>
                        <tr class="text-slate-400 text-[11px] font-black uppercase border-b border-slate-100">
                            <th class="py-4 text-right">Investigation</th>
                            <th class="py-4 text-center">Result</th>
                            <th class="py-4 text-center">Ref. Range</th>
                            <th class="py-4 text-center">Status</th>
                        </tr>
                    </thead>
                    <tbody id="reportTableBody" class="divide-y divide-slate-50"></tbody>
                </table>
            </div>

            <button onclick="window.print()" class="w-full mt-8 bg-slate-900 text-white py-6 rounded-[2rem] font-black shadow-lg no-print">طباعة التقرير النهائي</button>
        </div>
    </main>

    <script>
        const MASTER_DB = {
            // Hematology
            "HGB": { n: "Hemoglobin", ar: "الهيموجلوبين", u: "g/dL", r: "12.0 - 17.5", k: ["hb", "hgb", "hemoglobin"], c: v => v < 12 },
            "WBC": { n: "WBC Count", ar: "كريات الدم البيضاء", u: "10³/uL", r: "4.5 - 11.0", k: ["wbc"], c: v => v > 11 },
            "PLT": { n: "Platelets", ar: "الصفائح الدموية", u: "10³/uL", r: "150 - 450", k: ["plt", "platelets"], c: v => v < 150 },
            // Diabetes
            "HBA1C": { n: "HbA1c", ar: "السكر التراكمي", u: "%", r: "4.0 - 5.6", k: ["hba1c"], c: v => v > 6.4 },
            "FBS": { n: "Fasting Blood Sugar", ar: "سكر صائم", u: "mg/dL", r: "70 - 100", k: ["fbs", "glucose"], c: v => v > 125 },
            // Thyroid
            "TSH": { n: "TSH", ar: "هرمون الغدة الدرقية", u: "uIU/mL", r: "0.4 - 4.5", k: ["tsh"], c: v => v > 4.5 },
            "FT4": { n: "Free T4", ar: "T4 الحر", u: "ng/dL", r: "0.8 - 1.8", k: ["ft4"], c: v => v < 0.8 },
            // Vitamins
            "VITD": { n: "Vitamin D", ar: "فيتامين د", u: "ng/mL", r: "30 - 100", k: ["vitamin d", "vit d"], c: v => v < 20 },
            "B12": { n: "Vitamin B12", ar: "فيتامين B12", u: "pg/mL", r: "200 - 900", k: ["b12"], c: v => v < 200 },
            // Liver & Kidney
            "CREA": { n: "Creatinine", ar: "الكرياتينين", u: "mg/dL", r: "0.7 - 1.3", k: ["creatinine", "creat"], c: v => v > 1.3 },
            "ALT": { n: "ALT (GPT)", ar: "إنزيم كبد", u: "U/L", r: "< 41", k: ["alt", "gpt"], c: v => v > 41 },
            "AST": { n: "AST (GOT)", ar: "إنزيم كبد", u: "U/L", r: "< 40", k: ["ast", "got"], c: v => v > 40 },
            // Hormones
            "LH": { n: "LH", ar: "هرمون LH", u: "mIU/mL", r: "2.4 - 12.6", k: ["lh"], c: v => v > 12.6 },
            "FSH": { n: "FSH", ar: "هرمون FSH", u: "mIU/mL", r: "3.5 - 12.5", k: ["fsh"], c: v => v > 12.5 },
            "TESTO": { n: "Testosterone", ar: "هرمون الذكورة", u: "ng/dL", r: "240 - 950", k: ["testosterone", "testo"], c: v => v < 240 },
            "PRL": { n: "Prolactin", ar: "هرمون الحليب", u: "ng/mL", r: "4 - 23", k: ["prolactin", "prl"], c: v => v > 23 },
            // Cancer Markers
            "PSA": { n: "PSA Total", ar: "دليل البروستاتا", u: "ng/mL", r: "< 4.0", k: ["psa"], c: v => v > 4 },
            "CEA": { n: "CEA", ar: "دليل أورام القولون", u: "ng/mL", r: "< 5.0", k: ["cea"], c: v => v > 5 },
            "CA125": { n: "CA-125", ar: "دليل أورام المبيض", u: "U/mL", r: "< 35", k: ["ca125", "ca-125"], c: v => v > 35 },
            // Minerals
            "IRON": { n: "Serum Iron", ar: "حديد السيروم", u: "ug/dL", r: "60 - 170", k: ["iron"], c: v => v < 60 },
            "FERR": { n: "Ferritin", ar: "مخزون الحديد", u: "ng/mL", r: "30 - 400", k: ["ferritin"], c: v => v < 30 },
            "ZINC": { n: "Zinc", ar: "الزنك", u: "ug/dL", r: "70 - 120", k: ["zinc"], c: v => v < 70 }
        };

        let currentResults = {};
        let currentLang = 'ar';

        function addToReport(key, val) {
            currentResults[key] = val;
            const db = MASTER_DB[key];
            const isAlert = db.c(val);
            
            if (document.getElementById(`row-${key}`)) document.getElementById(`row-${key}`).remove();

            const row = `<tr id="row-${key}" class="font-bold border-b border-slate-50 transition">
                <td class="py-6 text-right"><div class="text-indigo-600">${db.n}</div><div class="text-[10px] text-slate-400 uppercase">${db.ar}</div></td>
                <td class="py-6 text-center text-2xl font-black">${val} <span class="text-[9px]">${db.u}</span></td>
                <td class="py-6 text-center text-slate-400 text-xs">${db.r}</td>
                <td class="py-6 text-center"><span class="px-4 py-2 rounded-xl text-[10px] ${isAlert ? 'bg-red-50 text-red-600 border border-red-100' : 'bg-green-50 text-green-600 border border-green-100'}">${isAlert ? (currentLang==='ar'?'غير طبيعي':'Abnormal') : (currentLang==='ar'?'طبيعي':'Normal')}</span></td>
            </tr>`;
            document.getElementById('reportTableBody').innerHTML += row;
            runDiagnosis();
        }

        function runDiagnosis() {
            let d = [];
            const r = currentResults;
            if(r.HGB < 12 && r.FERR < 30) d.push("● فقر دم بسبب نقص مخزون الحديد.");
            if(r.HBA1C > 6.4 || r.FBS > 125) d.push("● مؤشرات قوية للإصابة بالسكري.");
            if(r.TSH > 4.5) d.push("● خمول في الغدة الدرقية.");
            if(r.B12 < 200) d.push("● نقص فيتامين B12 (قد يسبب خدر أو تعب).");
            if(r.PSA > 4) d.push("● ارتفاع دليل البروستاتا (يجب مراجعة أخصائي مسالك).");
            if(r.PRL > 23) d.push("● ارتفاع هرمون الحليب.");
            
            const box = document.getElementById('diagnosisBox');
            if(d.length > 0) {
                box.classList.remove('hidden');
                document.getElementById('diagnosisContent').innerHTML = d.join('<br>');
            }
        }

        async function processImage(input) {
            document.getElementById('loader').classList.remove('hidden');
            const { data: { text } } = await Tesseract.recognize(input.files[0], 'eng');
            Object.keys(MASTER_DB).forEach(key => {
                MASTER_DB[key].k.forEach(keyword => {
                    const match = text.match(new RegExp(`${keyword}\\D*(\\d+\\.?\\d*)`, 'i'));
                    if (match) addToReport(key, parseFloat(match[1]));
                });
            });
            document.getElementById('loader').classList.add('hidden');
        }

        function manualAdd() {
            const k = document.getElementById('testType').value;
            const v = parseFloat(document.getElementById('testValue').value);
            if(!isNaN(v)) addToReport(k, v);
        }

        function setLanguage(l) {
            currentLang = l;
            document.getElementById('mainHtml').dir = l === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('btnAr').classList.toggle('bg-indigo-600', l === 'ar');
            document.getElementById('btnEn').classList.toggle('bg-indigo-600', l === 'en');
        }

        // تعبئة قائمة التحاليل
        const select = document.getElementById('testType');
        Object.keys(MASTER_DB).sort().forEach(k => {
            select.innerHTML += `<option value="${k}">${k} - ${MASTER_DB[k].ar}</option>`;
        });
        document.getElementById('rDate').innerText = new Date().toLocaleDateString('en-GB');
        document.getElementById('rID').innerText = 'AN-' + Math.random().toString(36).substr(2, 6).toUpperCase();
    </script>
</body>
</html>
