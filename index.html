<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تحليل المختبر الذكي - إصدار رفع الصور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- مكتبة OCR لتحويل الصور إلى نصوص -->
    <script src='https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js'></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f0f4f8; }
        .drop-zone { border: 3px dashed #cbd5e1; transition: all 0.3s ease; }
        .drop-zone.active { border-color: #6366f1; background-color: #eef2ff; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body class="p-2 md:p-6">

    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- لوحة التحكم (اليمين) -->
        <div class="lg:col-span-4 space-y-6 no-print">
            
            <!-- وحدة رفع الصور -->
            <div class="bg-white rounded-[2.5rem] p-8 shadow-xl border border-slate-200">
                <h3 class="text-sm font-black mb-6 text-indigo-600 flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    رفع صورة التحليل (Gallery/File)
                </h3>
                
                <div id="dropZone" class="drop-zone rounded-[1.5rem] p-10 text-center cursor-pointer mb-4">
                    <input type="file" id="fileInput" class="hidden" accept="image/*">
                    <div id="uploadContent">
                        <div class="bg-indigo-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                            <svg class="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        </div>
                        <p class="font-bold text-slate-600">اضغط هنا لرفع صورة أو اسحبها</p>
                        <p class="text-[10px] text-slate-400 mt-2 italic uppercase">JPG, PNG, WEBP Only</p>
                    </div>
                    <!-- لودر التحميل -->
                    <div id="loader" class="hidden">
                        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600 mx-auto"></div>
                        <p class="mt-4 text-xs font-black text-indigo-600 animate-pulse">جاري قراءة البيانات...</p>
                    </div>
                </div>
                
                <img id="previewImg" class="hidden w-full rounded-xl mb-4 shadow-md border" />
            </div>

            <!-- إدخال يدوي للقائمة الشاملة -->
            <div class="bg-white p-8 rounded-[2.5rem] shadow-xl border border-slate-200">
                <h3 class="font-black text-xs mb-4 text-slate-400 uppercase">إدخال يدوي متخصص</h3>
                <select id="testType" class="w-full bg-slate-50 p-4 rounded-xl mb-4 font-bold outline-none ring-1 ring-slate-200 focus:ring-2 ring-indigo-500"></select>
                <input type="number" id="testValue" placeholder="النتيجة" class="w-full bg-slate-100 p-6 rounded-xl mb-4 text-center text-4xl font-black text-slate-900 outline-none">
                <button onclick="manualAdd()" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-black hover:bg-indigo-700 transition-all shadow-lg active:scale-95">إضافة للتقرير</button>
            </div>
        </div>

        <!-- التقرير والتشخيص (اليسار) -->
        <div class="lg:col-span-8 space-y-6">
            
            <!-- كرت التشخيص الذكي -->
            <div id="diagCard" class="hidden bg-slate-900 rounded-[2.5rem] p-8 text-white shadow-2xl border-b-8 border-indigo-500 transition-all duration-500">
                <div class="flex items-center gap-3 mb-6">
                    <span class="p-2 bg-indigo-500 rounded-lg">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    </span>
                    <h3 class="font-black text-xl">التشخيص الطبي الأولي (Smart AI)</h3>
                </div>
                <div id="diagList" class="space-y-4 font-bold text-lg text-slate-200 leading-relaxed"></div>
            </div>

            <!-- التقرير النهائي -->
            <div id="printableReport" class="bg-white p-8 md:p-16 rounded-[3rem] shadow-2xl border border-slate-100 min-h-[900px]">
                <div class="flex flex-col md:flex-row justify-between items-start border-b-4 border-slate-900 pb-8 mb-10">
                    <div>
                        <h1 class="text-4xl font-black text-slate-900 uppercase">Lab Report</h1>
                        <p class="text-indigo-600 font-bold tracking-widest text-xs mt-2 uppercase">Professional Integrated Medical System</p>
                    </div>
                    <div class="mt-4 md:mt-0 text-left">
                        <div class="text-slate-400 text-[10px] font-bold">DATE: <span id="rDate" class="text-slate-900"></span></div>
                        <div class="text-slate-400 text-[10px] font-bold">ID: <span id="rID" class="text-indigo-600"></span></div>
                    </div>
                </div>

                <table class="w-full">
                    <thead>
                        <tr class="text-slate-400 text-[11px] font-black uppercase text-right border-b-2 border-slate-50">
                            <th class="py-4 px-2">INVESTIGATION / التحليل</th>
                            <th class="py-4 text-center">RESULT</th>
                            <th class="py-4 text-center">REFERENCE</th>
                            <th class="py-4 text-center">STATUS</th>
                        </tr>
                    </thead>
                    <tbody id="reportTable" class="divide-y divide-slate-50">
                        <!-- تظهر النتائج هنا -->
                    </tbody>
                </table>
            </div>

            <button onclick="window.print()" class="w-full bg-slate-950 text-white py-6 rounded-[2.5rem] font-black text-xl no-print hover:bg-indigo-600 transition-all">حفظ التقرير بصيغة PDF</button>
        </div>
    </div>

    <script>
        // 1. قاعدة بيانات التحاليل (القائمة الكاملة التي طلبتها)
        const LAB_MASTER = {
            "CBC": { n: "Complete Blood Count", ar: "صورة الدم الكاملة", r: "Normal", u: "-", k: ["cbc", "hgb", "wbc", "rbc"] },
            "ESR": { n: "ESR", ar: "سرعة الترسيب", r: "0-15", u: "mm/hr", k: ["esr"] },
            "HBA1C": { n: "HbA1c", ar: "السكر التراكمي", r: "4.0-5.6", u: "%", k: ["hba1c", "glyco"] },
            "FBS": { n: "FBS", ar: "سكر الصائم", r: "70-100", u: "mg/dL", k: ["fbs", "fasting", "glucose"] },
            "UREA": { n: "Blood Urea", ar: "اليوريا", r: "15-45", u: "mg/dL", k: ["urea"] },
            "CREATININE": { n: "Creatinine", ar: "الكرياتينين", r: "0.7-1.3", u: "mg/dL", k: ["creatinine", "creat"] },
            "TSH": { n: "TSH", ar: "الغدة الدرقية", r: "0.45-4.5", u: "uIU/mL", k: ["tsh", "thyrotropin"] },
            "TROPONIN": { n: "Troponin", ar: "تروبونين القلب", r: "<0.04", u: "ng/mL", k: ["troponin", "trop i"] },
            "PSA": { n: "PSA (Total)", ar: "دليل البروستاتا", r: "<4.0", u: "ng/mL", k: ["psa"] },
            "CRP": { n: "CRP", ar: "البروتين التفاعلي", r: "<6.0", u: "mg/L", k: ["crp", "reactive"] },
            "ALT": { n: "ALT (GPT)", ar: "إنزيم الكبد", r: "<41", u: "U/L", k: ["alt", "gpt"] },
            "AST": { n: "AST (GOT)", ar: "إنزيم الكبد", r: "<40", u: "U/L", k: ["ast", "got"] },
            "INR": { n: "INR", ar: "سيولة الدم", r: "0.8-1.1", u: "ratio", k: ["inr"] },
            "FERRITIN": { n: "Ferritin", ar: "مخزون الحديد", r: "30-400", u: "ng/mL", k: ["ferritin"] },
            "D_DIMER": { n: "D-Dimer", ar: "تحليل التجلط", r: "<500", u: "ng/mL", k: ["d-dimer"] }
        };

        let activeResults = {};

        // 2. إدارة رفع الملفات
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');

        dropZone.onclick = () => fileInput.click();

        fileInput.onchange = (e) => handleFile(e.target.files[0]);

        function handleFile(file) {
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('previewImg').src = e.target.result;
                document.getElementById('previewImg').classList.remove('hidden');
                processImage(e.target.result);
            };
            reader.readAsDataURL(file);
        }

        // 3. معالجة الصورة واستخراج النص (OCR)
        async function processImage(imgSource) {
            const uploadContent = document.getElementById('uploadContent');
            const loader = document.getElementById('loader');
            
            uploadContent.classList.add('hidden');
            loader.classList.remove('hidden');

            try {
                const result = await Tesseract.recognize(imgSource, 'eng');
                const text = result.data.text.toLowerCase();
                
                // البحث عن التحاليل في النص المستخرج
                Object.keys(LAB_MASTER).forEach(key => {
                    const test = LAB_MASTER[key];
                    test.k.forEach(keyword => {
                        if (text.includes(keyword)) {
                            // محاولة استخراج الرقم الذي يلي الكلمة المفتاحية
                            const regex = new RegExp(keyword + "[\\s\\:\\-]*(\\d+\\.?\\d*)", "i");
                            const match = text.match(regex);
                            if (match && match[1]) {
                                addToTable(key, parseFloat(match[1]));
                            }
                        }
                    });
                });
            } catch (err) {
                alert("حدث خطأ أثناء قراءة الصورة");
            } finally {
                uploadContent.classList.remove('hidden');
                loader.classList.add('hidden');
            }
        }

        // 4. تحديث الجدول والتشخيص
        function addToTable(key, val) {
            activeResults[key] = val;
            const db = LAB_MASTER[key];
            
            // حساب الحالة (مرتفع/منخفض)
            let status = "Normal";
            let statusClass = "bg-green-100 text-green-600";
            
            const refParts = db.r.split('-');
            if (refParts.length === 2) {
                if (val > parseFloat(refParts[1])) { status = "High ↑"; statusClass = "bg-red-100 text-red-600"; }
                if (val < parseFloat(refParts[0])) { status = "Low ↓"; statusClass = "bg-orange-100 text-orange-600"; }
            } else if (db.r.includes('<')) {
                if (val > parseFloat(db.r.replace('<', ''))) { status = "High ↑"; statusClass = "bg-red-100 text-red-600"; }
            }

            if (document.getElementById(`row-${key}`)) document.getElementById(`row-${key}`).remove();

            const row = `<tr id="row-${key}" class="font-bold">
                <td class="py-6 px-2"><span class="text-indigo-600 block text-lg">${db.n}</span><span class="text-[10px] text-slate-400 font-bold">${db.ar}</span></td>
                <td class="py-6 text-center text-3xl font-black text-slate-900">${val} <span class="text-[10px] text-slate-400">${db.u}</span></td>
                <td class="py-6 text-center text-slate-400 font-mono">${db.r}</td>
                <td class="py-6 text-center"><span class="px-5 py-2 rounded-xl text-xs ${statusClass}">${status}</span></td>
            </tr>`;
            
            document.getElementById('reportTable').innerHTML += row;
            runAI();
        }

        // 5. محرك التشخيص الذكي
        function runAI() {
            let advice = [];
            const r = activeResults;

            if (r.HBA1C > 6.4) advice.push("● تشير نتائج HbA1c إلى إصابة بمرض السكري (Diabetic Range).");
            if (r.TROPONIN > 0.04) advice.push("● تحذير: ارتفاع التروبونين يتطلب تدخلاً طبياً فورياً لفحص سلامة القلب.");
            if (r.CREATININE > 1.3) advice.push("● ارتفاع الكرياتينين قد يشير إلى ضغط على وظائف الكلى.");
            if (r.TSH > 4.5) advice.push("● ارتفاع TSH قد يعني قصوراً في نشاط الغدة الدرقية (Hypothyroidism).");
            if (r.CRP > 10) advice.push("● مؤشر CRP مرتفع، مما يدل على وجود التهاب نشط في الجسم.");

            const card = document.getElementById('diagCard');
            const list = document.getElementById('diagList');
            
            if (advice.length > 0) {
                card.classList.remove('hidden');
                list.innerHTML = advice.join('<br>');
            }
        }

        // إعدادات أولية
        const sel = document.getElementById('testType');
        Object.keys(LAB_MASTER).sort().forEach(k => {
            sel.innerHTML += `<option value="${k}">${k} - ${LAB_MASTER[k].ar}</option>`;
        });
        document.getElementById('rDate').innerText = new Date().toLocaleDateString();
        document.getElementById('rID').innerText = 'ANALYTICS-' + Math.random().toString(36).substr(2, 9).toUpperCase();

        function manualAdd() {
            const k = sel.value;
            const v = parseFloat(document.getElementById('testValue').value);
            if (!isNaN(v)) addToTable(k, v);
        }
    </script>
</body>
</html>
