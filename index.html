<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المختبر الذكي | نظام التحليل المتكامل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            .no-print { display: none; }
            .print-only { display: block; }
            body { background: white; padding: 0; }
            .report-card { shadow: none; border: 1px solid #eee; }
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- القائمة العلوية -->
    <nav class="bg-blue-800 text-white p-4 shadow-md no-print">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">نظام التحليلات المرضية المستقل</h1>
            <span class="text-sm bg-blue-700 px-3 py-1 rounded">V 1.0 - جاهز للعمل</span>
        </div>
    </nav>

    <main class="container mx-auto p-4 md:p-8">
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- القسم الأول: إدخال البيانات (المدخلات) -->
            <div class="lg:col-span-1 space-y-6 no-print">
                <div class="bg-white p-6 rounded-lg shadow-sm border-t-4 border-blue-500">
                    <h2 class="text-lg font-semibold mb-4 border-b pb-2">1. بيانات المريض</h2>
                    <div class="space-y-3">
                        <input type="text" id="pName" placeholder="اسم المريض بالكامل" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-400 outline-none">
                        <div class="grid grid-cols-2 gap-2">
                            <input type="number" id="pAge" placeholder="العمر" class="border p-2 rounded">
                            <select id="pGender" class="border p-2 rounded">
                                <option value="ذكر">ذكر</option>
                                <option value="أنثى">أنثى</option>
                            </select>
                        </div>
                        <textarea id="pHistory" placeholder="ملاحظات سريرية أو تاريخ مرضي..." class="w-full border p-2 rounded h-20"></textarea>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-lg shadow-sm border-t-4 border-green-500">
                    <h2 class="text-lg font-semibold mb-4 border-b pb-2">2. تسجيل التحاليل</h2>
                    <div class="space-y-3">
                        <select id="testType" class="w-full border p-2 rounded bg-gray-50">
                            <optgroup label="السكر والتمثيل الغذائي">
                                <option value="GLUCOSE">سكر الدم (عشوائي)</option>
                                <option value="HBA1C">السكر التراكمي (HbA1c)</option>
                            </optgroup>
                            <optgroup label="وظائف الكلى">
                                <option value="CREATININE">كرياتينين (Creatinine)</option>
                                <option value="UREA">يوريا (Urea)</option>
                            </optgroup>
                            <optgroup label="الدم والالتهابات">
                                <option value="HGB">الهيموجلوبين (Hb)</option>
                                <option value="WBC">كريات الدم البيضاء (WBC)</option>
                                <option value="CRP">البروتين التفاعلي (CRP)</option>
                            </optgroup>
                        </select>
                        <input type="number" id="testValue" placeholder="أدخل النتيجة هنا..." class="w-full border p-2 rounded text-lg font-bold text-blue-700">
                        <button onclick="processMedicalAnalysis()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition">إضافة وتحليل الآن</button>
                    </div>
                </div>
            </div>

            <!-- القسم الثاني: عرض النتائج والتقرير (المخرجات) -->
            <div class="lg:col-span-2 space-y-6">
                <div id="printArea" class="bg-white p-8 rounded-lg shadow-md min-h-[600px] relative report-card">
                    <!-- ترويسة التقرير -->
                    <div class="flex justify-between items-start border-b-2 border-gray-800 pb-4 mb-6">
                        <div>
                            <h2 class="text-2xl font-black text-gray-900">تقرير نتائج مختبرية</h2>
                            <p class="text-gray-500 text-sm">Laboratry Analysis Report</p>
                        </div>
                        <div class="text-left">
                            <p id="reportDate" class="font-mono text-sm"></p>
                            <p class="text-xs text-gray-400">ID: #<span id="reportID"></span></p>
                        </div>
                    </div>

                    <!-- معلومات المريض في التقرير -->
                    <div class="grid grid-cols-3 gap-4 mb-8 text-sm bg-gray-50 p-4 rounded">
                        <p><strong>المريض:</strong> <span id="display_pName">---</span></p>
                        <p><strong>العمر:</strong> <span id="display_pAge">---</span></p>
                        <p><strong>الجنس:</strong> <span id="display_pGender">---</span></p>
                    </div>

                    <!-- جدول النتائج -->
                    <table class="w-full text-right border-collapse mb-8">
                        <thead>
                            <tr class="border-b-2 border-gray-300 bg-gray-100">
                                <th class="p-3 text-sm">اسم التحليل</th>
                                <th class="p-3 text-sm">النتيجة</th>
                                <th class="p-3 text-sm">المدى الطبيعي</th>
                                <th class="p-3 text-sm">الحالة</th>
                            </tr>
                        </thead>
                        <tbody id="resultsTableBody">
                            <!-- النتائج تضاف برمجياً هنا -->
                        </tbody>
                    </table>

                    <!-- التفسير الطبي المدمج -->
                    <div id="medicalInterpretations" class="mt-10 space-y-4">
                        <h3 class="text-md font-bold text-blue-900 border-r-4 border-blue-900 pr-2">التفسير الطبي والمعلومات العلمية:</h3>
                        <div id="interpretationList" class="text-sm text-gray-700 space-y-2">
                            <!-- التفسيرات تظهر هنا -->
                        </div>
                    </div>

                    <div class="absolute bottom-8 left-8 text-xs text-gray-300 no-print">
                        نظام مستقل - لا يتطلب خادم خارجي
                    </div>
                </div>

                <div class="flex gap-4 no-print">
                    <button onclick="window.print()" class="flex-1 bg-gray-800 text-white py-3 rounded-lg font-bold flex items-center justify-center gap-2">
                        <span>طباعة التقرير (PDF)</span>
                    </button>
                    <button onclick="location.reload()" class="bg-red-50 text-red-600 px-6 py-3 rounded-lg border border-red-200 hover:bg-red-100">مسح البيانات</button>
                </div>
            </div>

        </div>
    </main>

    <script>
        // 1. قاعدة البيانات الطبية (الموسوعة)
        const medicalDB = {
            "GLUCOSE": {
                name: "Fasting Blood Sugar",
                unit: "mg/dL",
                normal: "70 - 100",
                calc: (v) => {
                    if(v < 70) return { status: "منخفض", danger: true, info: "هبوط سكر الدم: قد يسبب دوار وفقدان وعي. يجب تناول سكريات سريعة." };
                    if(v <= 100) return { status: "طبيعي", danger: false, info: "المستوى طبيعي ومستقر." };
                    if(v <= 125) return { status: "ما قبل السكري", danger: false, info: "مرحلة Prediabetes: يجب تقليل الكربوهيدرات وممارسة الرياضة." };
                    return { status: "مرتفع", danger: true, info: "مؤشر إصابة بالسكري: يتطلب استشارة طبية فورية وتنظيم غذائي صارم." };
                }
            },
            "CREATININE": {
                name: "Serum Creatinine",
                unit: "mg/dL",
                normal: "0.6 - 1.3",
                calc: (v) => {
                    if(v > 1.3) return { status: "مرتفع", danger: true, info: "قصور كلوي محتمل: الكلى لا تصفح الفضلات بشكل جيد. تجنب الأدوية المسكنة بكثرة." };
                    if(v < 0.6) return { status: "منخفض", danger: false, info: "غالباً ما يرتبط بضعف الكتلة العضلية أو سوء التغذية." };
                    return { status: "طبيعي", danger: false, info: "وظائف الكلى سليمة." };
                }
            },
            "HBA1C": {
                name: "HbA1c (Trakumi)",
                unit: "%",
                normal: "4.0 - 5.6",
                calc: (v) => {
                    if(v <= 5.6) return { status: "طبيعي", danger: false, info: "معدل السكر التراكمي ممتاز لآخر 3 أشهر." };
                    if(v <= 6.4) return { status: "مرحلة خطرة", danger: false, info: "بداية بوادر السكري. راقب وزنك ونظامك الغذائي." };
                    return { status: "سكري غير منضبط", danger: true, info: "السكري مرتفع جداً: خطر على الأوعية الدموية والأعصاب." };
                }
            },
            "CRP": {
                name: "C-Reactive Protein",
                unit: "mg/L",
                normal: "< 10",
                calc: (v) => {
                    if(v > 10) return { status: "التهاب مرتفع", danger: true, info: "وجود التهاب حاد في الجسم (عدوى، إصابة، أو مرض مناعي)." };
                    return { status: "طبيعي", danger: false, info: "لا يوجد مؤشر التهاب حاد." };
                }
            }
        };

        // ضبط التاريخ والمعرف عند الفتح
        document.getElementById('reportDate').innerText = new Date().toLocaleDateString('ar-EG');
        document.getElementById('reportID').innerText = Math.floor(1000 + Math.random() * 9000);

        function processMedicalAnalysis() {
            // جلب البيانات
            const name = document.getElementById('pName').value || "مريض افتراضي";
            const age = document.getElementById('pAge').value;
            const gender = document.getElementById('pGender').value;
            const testKey = document.getElementById('testType').value;
            const val = parseFloat(document.getElementById('testValue').value);

            if(isNaN(val)) { alert("أدخل قيمة عددية صحيحة نرجوك"); return; }

            // تحديث بيانات التقرير العلوي
            document.getElementById('display_pName').innerText = name;
            document.getElementById('display_pAge').innerText = age;
            document.getElementById('display_pGender').innerText = gender;

            // إجراء التحليل
            const testData = medicalDB[testKey];
            const result = testData.calc(val);

            // إضافة سطر للجدول
            const newRow = `
                <tr class="border-b ${result.danger ? 'text-red-600 bg-red-50' : 'text-gray-800'}">
                    <td class="p-3 font-medium">${testData.name}</td>
                    <td class="p-3 font-bold">${val} ${testData.unit}</td>
                    <td class="p-3 text-gray-500">${testData.normal}</td>
                    <td class="p-3 font-bold">${result.status}</td>
                </tr>
            `;
            document.getElementById('resultsTableBody').innerHTML += newRow;

            // إضافة التفسير العلمي أسفل التقرير
            const infoBlock = `
                <div class="p-3 bg-blue-50 rounded-lg border-r-2 border-blue-300">
                    <strong>${testData.name}:</strong> ${result.info}
                </div>
            `;
            document.getElementById('interpretationList').innerHTML += infoBlock;

            // مسح حقل النتيجة لإدخال فحص آخر
            document.getElementById('testValue').value = "";
        }
    </script>
</body>
</html>
